[project]
name = "face-detection"
version = "0.1.0"
description = "Face detection microservice (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy",
  "pillow",
  "onnxruntime>=1.18",   # adjust if you really use mediapipe/opencv/torch
  "python-multipart>=0.0.9",
  "common==0.1.0",
]

[tool.uv.sources]
common = { workspace = true }
