[project]
name = "face-detection"
version = "0.1.0"
description = "Face detection microservice (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy",
  "pillow",
  "mediapipe>=0.10",
  "opencv-python-headless>=4.8",
  "python-multipart>=0.0.9",
  "common==0.1.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# tell hatch which package(s) live under src/
[tool.hatch.build.targets.wheel]
packages = ["src/face_detection"]
