[project]
name = "catdog-classifier"
version = "0.1.0"
description = "Cat/Dog classifier microservice (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "numpy",
  "pillow",
  "tensorflow>=2.17,<3.0",
  "python-multipart>=0.0.9",
  "common==0.1.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# tell hatch which package(s) live under src/
[tool.hatch.build.targets.wheel]
packages = ["src/catdog_classifier"]
