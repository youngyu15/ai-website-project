[project]
name = "catdog-classifier"
version = "0.1.0"
description = "Cat/Dog classifier microservice (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy",
  "pillow",
  "onnxruntime>=1.18",   # or torch/tf if that's what you run
  "python-multipart>=0.0.9",
  "common==0.1.0",
]

[tool.uv.sources]
common = { workspace = true }
