[project]
name = "common"
version = "0.1.0"
description = "Shared schemas, clients, storage utils"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "boto3>=1.34",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# tell hatch which package(s) live under src/
[tool.hatch.build.targets.wheel]
packages = ["src/common"]
