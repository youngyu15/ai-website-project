[project]
name = "api"
version = "0.1.0"
description = "Public FastAPI gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  "sqlmodel>=0.0.24",
  "alembic>=1.16.5",
  "asyncpg>=0.30.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.10.1",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "boto3>=1.34",
  "common==0.1.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# tell hatch which package(s) live under src/
[tool.hatch.build.targets.wheel]
packages = ["src/api"]
