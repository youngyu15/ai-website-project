[project]
name = "ai-website-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.115.8",
    "passlib[bcrypt]>=1.7.4",
    "sqlmodel>=0.0.24",
    "python-jose[cryptography]>=3.3",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "redis>=5.0",  # optional later
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.6"]

[tool.uvicorn]
factory = false
