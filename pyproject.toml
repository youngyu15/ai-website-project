[project]
name = "ai-website-project"
version = "0.1.0"
description = "Monorepo for AI Website: FastAPI API + ML microservices"
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.3", "httpx>=0.27"]

[tool.uv.workspace]
members = [
  "apps/api",
  "services/face-detection",
  "services/catdog-classifier",
  "packages/common",
]

[tool.uv]
environments = ["linux-x86_64-cpython-3.12"]
