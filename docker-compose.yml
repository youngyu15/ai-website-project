services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_website_project}
    ports:
      - "5433:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    environment:
      # Ensure your API binds to the same service name "db"
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_website_project}?ssl=false
      HOST: 0.0.0.0
      PORT: "8000"
      RUN_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  face-service:
    build: ./services/face-service
    image: ai-site/face-service:local
    ports:
      - "8010:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 2s
      retries: 6
    restart: unless-stopped
  
  catdog-service:
    build: ./services/catdog-service
    image: ai-site/catdog-service:local
    ports:
      - "8011:8001"
    volumes:
      - ./models/catdog/model_v-03.h5:/models/model_v-03.h5:ro
    environment:
      - MODEL_PATH=/models/model_v-03.h5
      # If you know the exact size, set it; otherwise it will infer.
      # - IMG_SIZE=128
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped


volumes:
  pgdata:
